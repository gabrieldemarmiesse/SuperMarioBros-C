name: Emulator tools

on:
  push:
    paths:
      - 'plugins/emulator-use/**'
      - '.github/workflows/emulator-tools.yml'
  pull_request:
    paths:
      - 'plugins/emulator-use/**'
      - '.github/workflows/emulator-tools.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/emulator-use
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --locked --group dev pytest -q
